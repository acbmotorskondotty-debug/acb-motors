
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACB MOTORS - Used Vehicles</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #fff;
  color: #222;
}

header {
  background: #c90000;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 8px;
  letter-spacing: 1px;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

nav button {
  background: #c90000;
  color: white;
  border: none;
  padding: 11px 18px;
  border-radius: 5px;
  cursor: pointer;
}

h2 {
  text-align: center;
  margin: 25px 0 15px;
  color: #c90000;
}

.categories {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px;
}

.categories button {
  padding: 12px 20px;
  background: white;
  border: 2px solid #c90000;
  color: #c90000;
  border-radius: 5px;
  cursor: pointer;
}

.categories button:hover {
  background: #c90000;
  color: white;
}

#vehicles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  padding: 20px;
}

.vehicle {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ddd;
}

.vehicle img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  background: #eee;
}

.vehicle h3 {
  padding: 10px;
}

.vehicle p {
  padding: 0 10px 10px;
}

footer {
  background: #c90000;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>ACB MOTORS</h1>
  <p>ALL TYPES OF USED VEHICLES</p>
</header>

<h2>OUR CATEGORIES</h2>

<div class="categories">
  <button onclick="showCategory('All')">All Vehicles</button>
  <button onclick="showCategory('Diesel')">Car - Diesel</button>
  <button onclick="showCategory('Petrol')">Car - Petrol</button>
  <button onclick="showCategory('EV')">Car - EV</button>
  <button onclick="showCategory('Bike')">Bike</button>
  <button onclick="showCategory('Scooty')">Scooty</button>
</div>

<h2>AVAILABLE VEHICLES</h2>

<div id="vehicles"></div>

<footer>
  <p>ACB MOTORS</p>
  <p>Contact: +91 95620 10485</p>
</footer>

<script>
const vehicles = [
  {
    name: "Example Car",
    year: "2020",
    owner: "1st Owner",
    category: "Diesel",
    photo: "https://placehold.co/600x400?text=Car"
  },
  {
    name: "Example Bike",
    year: "2022",
    owner: "1st Owner",
    category: "Bike",
    photo: "https://placehold.co/600x400?text=Bike"
  },
  {
    name: "Example Scooty",
    year: "2021",
    owner: "2nd Owner",
    category: "Scooty",
    photo: "https://placehold.co/600x400?text=Scooty"
  }
];

function showCategory(category) {
  const container = document.getElementById("vehicles");
  container.innerHTML = "";

  const filtered = category === "All"
    ? vehicles
    : vehicles.filter(v => v.category === category);

  filtered.forEach(vehicle => {
    container.innerHTML += `
      <div class="vehicle">
        <img src="${vehicle.photo}" alt="${vehicle.name}">
        <h3>${vehicle.name}</h3>
        <p>Year: ${vehicle.year}</p>
        <p>Owner: ${vehicle.owner}</p>
      </div>
    `;
  });
}

showCategory("All");
</script>

</body>
</html>
