<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACB MOTORS | Admin Panel</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #c90000;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 26px;
}

header p {
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 5px;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 4px 20px #0001;
  margin-bottom: 20px;
}

h2 {
  color: #c90000;
  margin-bottom: 18px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  outline-color: #c90000;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

.primary {
  background: #c90000;
  color: white;
}

.secondary {
  background: #555;
  color: white;
}

.delete {
  background: #222;
  color: white;
}

.full {
  width: 100%;
}

#loginBox {
  max-width: 420px;
  margin: 35px auto;
}

#adminArea {
  display: none;
}

.vehicle-item {
  background: #fafafa;
  border: 1px solid #eee;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 14px;
}

.vehicle-item h3 {
  color: #c90000;
  margin-bottom: 8px;
}

.vehicle-photos {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 12px 0;
}

.vehicle-photos img {
  width: 90px;
  height: 75px;
  object-fit: cover;
  border-radius: 7px;
}

.vehicle-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.photo-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}

.photo-preview {
  width: 105px;
  position: relative;
}

.photo-preview img {
  width: 105px;
  height: 85px;
  object-fit: cover;
  border-radius: 7px;
}

.photo-preview button {
  width: 100%;
  margin-top: 4px;
  padding: 7px;
  background: #444;
  color: white;
  font-size: 12px;
}

#message {
  margin: 12px 0;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

label {
  font-weight: bold;
  font-size: 14px;
}

@media(max-width:600px) {
  .container {
    padding: 10px;
  }

  .box {
    padding: 17px;
  }
}
</style>
</head>

<body>

<header>
  <h1>ACB MOTORS</h1>
  <p>ADMIN CONTROL PANEL</p>
</header>

<div class="container">

  <!-- ADMIN LOGIN -->
  <div class="box" id="loginBox">
    <h2>Admin Login</h2>

    <input
      id="adminEmail"
      type="email"
      placeholder="Admin Email"
      autocomplete="username"
    >

    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="primary full" onclick="adminLogin()">
      Login
    </button>

    <p id="loginMessage"></p>
  </div>

  <!-- ADMIN AREA -->
  <div id="adminArea">

    <div class="box">
      <h2>Welcome Admin</h2>
      <button class="secondary" onclick="adminLogout()">
        Logout
      </button>
    </div>

    <!-- ADD / EDIT VEHICLE -->
    <div class="box">
      <h2 id="formTitle">Add New Vehicle</h2>

      <form id="vehicleForm" onsubmit="saveVehicle(event)">

        <label>Vehicle Name</label>
        <input
          id="name"
          type="text"
          placeholder="Vehicle Name"
          required
        >

        <label>Category</label>
        <select id="category" required>
          <option value="Bike">Bike</option>
          <option value="Scooty">Scooty</option>
        </select>

        <label>Year</label>
        <input
          id="year"
          type="number"
          placeholder="Year"
          min="1900"
          max="2100"
          required
        >

        <label>Owner</label>
        <input
          id="owner"
          type="text"
          placeholder="Number of Owners"
          required
        >

        <label>Price</label>
        <input
          id="price"
          type="text"
          placeholder="₹45,000 / 45K / Negotiable"
        >

        <label>Kilometers</label>
        <input
          id="km"
          type="number"
          placeholder="Kilometers Driven"
          min="0"
        >

        <label>Fuel Type</label>
        <input
          id="fuel"
          type="text"
          value="Petrol"
          readonly
        >

        <label>Description</label>
        <textarea
          id="description"
          placeholder="Vehicle Description"
        ></textarea>

        <label>Vehicle Photos (Multiple Photos)</label>
        <input
          id="photos"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="existingPhotos" class="photo-list"></div>

        <p style="font-size:13px;color:#666;">
          Edit ചെയ്യുമ്പോൾ പുതിയ ഫോട്ടോകളും ചേർക്കാം.
          Remove അമർത്തിയാൽ ആ ഫോട്ടോ വാഹനത്തിൽ നിന്ന് നീക്കം ചെയ്യും.
        </p>

        <button
          type="submit"
          class="primary full"
          id="saveButton"
        >
          Save Vehicle
        </button>

        <button
          type="button"
          class="secondary full"
          style="margin-top:10px;"
          onclick="clearForm()"
        >
          Clear Form
        </button>

      </form>

      <p id="message"></p>
    </div>

    <!-- VEHICLE LIST -->
    <div class="box">
      <h2>Manage Vehicles</h2>

      <button class="secondary" onclick="loadVehicles()">
        Refresh Vehicles
      </button>

      <div id="vehicleList" style="margin-top:18px;">
        Loading...
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://tcaewtllgfohthboyivb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WvQQ7IHQr9kQf-S07LY65A_U66frylM";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let existingPhotoUrls = [];
let adminUserId = null;

const BUCKET = "vehicle-photos";

// MESSAGE
function showMessage(message, color = "#c90000") {
  const element = document.getElementById("message");
  element.textContent = message;
  element.style.color = color;
}

// ADMIN LOGIN
async function adminLogin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const message = document.getElementById("loginMessage");

  if (!email || !password) {
    message.textContent = "Enter email and password.";
    return;
  }

  message.textContent = "Checking login...";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    const userId = data.user.id;

    const { data: admin, error: adminError } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

    if (adminError) throw adminError;

    if (!admin) {
      await supabaseClient.auth.signOut();
      throw new Error("You are not an authorized admin.");
    }

    adminUserId = userId;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminArea").style.display = "block";

    await loadVehicles();

  } catch (error) {
    message.textContent = "Login Error: " + error.message;
  }
}

// CHECK SESSION
async function checkAdminSession() {
  const { data } = await supabaseClient.auth.getSession();

  if (!data.session) return;

  const userId = data.session.user.id;

  const { data: admin, error } = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", userId)
    .maybeSingle();

  if (error || !admin) {
    await supabaseClient.auth.signOut();
    return;
  }

  adminUserId = userId;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminArea").style.display = "block";

  await loadVehicles();
}

// LOGOUT
async function adminLogout() {
  await supabaseClient.auth.signOut();

  adminUserId = null;

  document.getElementById("adminArea").style.display = "none";
  document.getElementById("loginBox").style.display = "block";

  clearForm();
}

// LOAD VEHICLES
async function loadVehicles() {
  const list = document.getElementById("vehicleList");

  list.textContent = "Loading vehicles...";

  const { data, error } = await supabaseClient
    .from("vehicles")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Error: " + error.message;
    return;
  }

  const vehicles = (data || []).filter(vehicle =>
    ["Bike", "Scooty"].includes(vehicle.category)
  );

  list.innerHTML = "";

  if (!vehicles.length) {
    list.textContent = "No vehicles added yet.";
    return;
  }

  vehicles.forEach(vehicle => {
    const item = document.createElement("div");
    item.className = "vehicle-item";

    const title = document.createElement("h3");
    title.textContent = vehicle.name || "Vehicle";

    const info = document.createElement("p");
    info.textContent =
      vehicle.category + " | Year: " + (vehicle.year || "-");

    const owner = document.createElement("p");
    owner.textContent = "Owner: " + (vehicle.owner || "-");

    const price = document.createElement("p");
    price.textContent = "Price: " + (vehicle.price || "-");

    const photos = document.createElement("div");
    photos.className = "vehicle-photos";

    const photoUrls = Array.isArray(vehicle.photo_urls)
      ? vehicle.photo_urls
      : [];

    const images = photoUrls.length
      ? photoUrls
      : [vehicle.photo_url].filter(Boolean);

    images.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = vehicle.name || "Vehicle";
      photos.appendChild(img);
    });

    const actions = document.createElement("div");
    actions.className = "vehicle-actions";

    const editButton = document.createElement("button");
    editButton.className = "primary";
    editButton.textContent = "Edit";
    editButton.onclick = () => editVehicle(vehicle);

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.onclick = () => deleteVehicle(vehicle);

    actions.append(editButton, deleteButton);

    item.append(title, info, owner, price, photos, actions);
    list.appendChild(item);
  });
}

// PHOTO PREVIEW
function renderExistingPhotos() {
  const container = document.getElementById("existingPhotos");
  container.innerHTML = "";

  existingPhotoUrls.forEach((url, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "photo-preview";

    const img = document.createElement("img");
    img.src = url;
    img.alt = "Existing vehicle photo";

    const removeButton = document.createElement("button");
    removeButton.textContent = "Remove";

    removeButton.onclick = () => {
      existingPhotoUrls.splice(index, 1);
      renderExistingPhotos();
    };

    wrapper.append(img, removeButton);
    container.appendChild(wrapper);
  });
}

// EDIT VEHICLE
function editVehicle(vehicle) {
  editingId = vehicle.id;

  document.getElementById("formTitle").textContent =
    "Edit Vehicle";

  document.getElementById("name").value = vehicle.name || "";
  document.getElementById("category").value = vehicle.category || "Bike";
  document.getElementById("year").value = vehicle.year || "";
  document.getElementById("owner").value = vehicle.owner || "";
  document.getElementById("price").value = vehicle.price || "";
  document.getElementById("km").value = vehicle.km ?? "";
  document.getElementById("fuel").value = "Petrol";
  document.getElementById("description").value =
    vehicle.description || "";

  document.getElementById("photos").value = "";

  existingPhotoUrls =
    Array.isArray(vehicle.photo_urls) && vehicle.photo_urls.length
      ? [...vehicle.photo_urls]
      : [vehicle.photo_url].filter(Boolean);

  renderExistingPhotos();

  document.getElementById("formTitle").scrollIntoView({
    behavior: "smooth"
  });

  showMessage("Editing: " + vehicle.name, "#168b42");
}

// SAVE VEHICLE
async function saveVehicle(event) {
  event.preventDefault();

  if (!adminUserId) {
    showMessage("Please login first.");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value;
  const year = document.getElementById("year").value;
  const owner = document.getElementById("owner").value.trim();
  const price = document.getElementById("price").value.trim();
  const km = document.getElementById("km").value;
  const description =
    document.getElementById("description").value.trim();

  const files = Array.from(
    document.getElementById("photos").files
  );

  if (!name || !year || !owner) {
    showMessage("Please fill all required fields.");
    return;
  }

  const saveButton = document.getElementById("saveButton");
  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  showMessage("Please wait. Saving vehicle...");

  try {
    let photoUrls = [...existingPhotoUrls];

    // UPLOAD NEW PHOTOS
    for (const file of files) {
      if (!file.type.startsWith("image/")) {
        throw new Error("Only image files are allowed.");
      }

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      const filePath =
        Date.now() + "_" +
        Math.random().toString(36).slice(2) +
        "_" + safeName;

      const { error: uploadError } =
        await supabaseClient.storage
          .from(BUCKET)
          .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false
          });

      if (uploadError) throw uploadError;

      const { data: publicData } =
        supabaseClient.storage
          .from(BUCKET)
          .getPublicUrl(filePath);

      photoUrls.push(publicData.publicUrl);
    }

    const vehicleData = {
      name: name,
      category: category,
      year: Number(year),
      owner: owner,
      price: price || null,
      km: km ? Number(km) : null,
      fuel_type: "Petrol",
      description: description || null,
      photo_urls: photoUrls,
      photo_url: photoUrls[0] || null
    };

    let result;

    if (editingId) {
      result = await supabaseClient
        .from("vehicles")
        .update(vehicleData)
        .eq("id", editingId);
    } else {
      result = await supabaseClient
        .from("vehicles")
        .insert(vehicleData);
    }

    if (result.error) throw result.error;

    showMessage(
      editingId
        ? "Vehicle updated successfully!"
        : "Vehicle added successfully!",
      "#168b42"
    );

    clearForm();
    await loadVehicles();

  } catch (error) {
    showMessage("Error: " + error.message);
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "Save Vehicle";
  }
}

// DELETE VEHICLE
async function deleteVehicle(vehicle) {
  if (!confirm(
    "Are you sure you want to delete " + vehicle.name + "?"
  )) return;

  const { error } = await supabaseClient
    .from("vehicles")
    .delete()
    .eq("id", vehicle.id);

  if (error) {
    alert("Delete Error: " + error.message);
    return;
  }

  if (editingId === vehicle.id) {
    clearForm();
  }

  alert("Vehicle deleted successfully.");

  await loadVehicles();
}

// CLEAR FORM
function clearForm() {
  editingId = null;
  existingPhotoUrls = [];

  document.getElementById("vehicleForm").reset();

  document.getElementById("fuel").value = "Petrol";
  document.getElementById("category").value = "Bike";

  document.getElementById("existingPhotos").innerHTML = "";
  document.getElementById("formTitle").textContent =
    "Add New Vehicle";

  document.getElementById("saveButton").textContent =
    "Save Vehicle";

  document.getElementById("saveButton").disabled = false;

  showMessage("");
}

// START
checkAdminSession();
</script>

</body>
</html>
